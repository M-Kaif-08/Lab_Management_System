services:
  db:
    image: postgres:16-alpine
    container_name: lab_postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-lab_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - lab_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-lab_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: lab_api
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-lab_db}
      JWT_SECRET: ${JWT_SECRET:-lab_secret_key_change_in_production}
      STORAGE_PATH: /app/storage
    volumes:
      - app_storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
    networks:
      - lab_internal

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    container_name: lab_web
    restart: always
    ports:
      - "${HOST_PORT:-80}:80"
    depends_on:
      - api
    networks:
      - lab_internal

networks:
  lab_internal:
    driver: bridge

volumes:
  postgres_data:
  app_storage:
